<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132339"><title>パズサバ ゲーム用語集</title><style>
:root{--bg:#f6f8fc;--ink:#15233a;--sub:#5e6e83;--line:#e4eaf1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}header{background:#132339;color:#fff;padding:23px 16px}header>div,main,footer{max-width:930px;margin:auto}h1{font-size:23px;margin:0 0 4px}header p{font-size:13px;color:#c2d2e4;margin:0}main{padding:15px 14px 35px}.tools{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.tools label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.search{display:flex;gap:8px}input{width:100%;min-width:0;border:1px solid #bfcdda;border-radius:10px;padding:12px;font:inherit}button{cursor:pointer;font:inherit}#clear{border:1px solid var(--line);border-radius:10px;background:#f3f7fb;padding:0 13px}.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 2px;color:var(--sub);font-size:13px}.toggle{background:#fff;border:1px solid #b9d3e6;color:#125883;border-radius:9px;padding:8px 10px;font-size:12px}.list{display:grid;gap:9px}.item{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 2px 8px #1b456009}.en{font-weight:750;font-size:16px;overflow-wrap:anywhere}.ja{margin-top:7px;font-size:14px}.note{margin-top:6px;font-size:12px;color:var(--sub)}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:white}table{border-collapse:collapse;width:100%;min-width:480px}th{text-align:left;background:#f1f6fa;color:#52657a;font-size:12px}th,td{padding:11px;border-bottom:1px solid var(--line);vertical-align:top}td:first-child{font-weight:650}tr:last-child td{border:0}.empty{padding:30px;text-align:center;color:var(--sub)}footer{padding:0 16px 30px;color:var(--sub);font-size:12px;text-align:center}@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}@media(max-width:400px){h1{font-size:20px}.item{padding:12px}}
.event-tag{display:inline-block;margin-left:8px;padding:2px 7px;border-radius:7px;background:#e9f2ff;color:#235b86;font-size:11px;font-weight:650;vertical-align:middle;white-space:nowrap}.enrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap}</style></head><body><header><div><h1>📚 パズサバ ゲーム用語集</h1><p>英語・略語から日本語の意味を調べられるミニ辞典</p></div></header><main><section class="tools"><label for="search">🔎 英語・日本語で検索</label><div class="search"><input id="search" type="search" placeholder="例：rally / 増援 / NAP" autocomplete="off"><button id="clear" type="button">クリア</button></div></section><div class="bar"><span id="count"></span><span>A → Z　<button id="toggle" class="toggle" type="button">表形式に切替</button></span></div><div id="results" aria-live="polite"></div></main><footer>更新：2026-11-08｜共有テスト版｜オフライン閲覧可・自動同期なし<br>一部の略語・訳語はギルドや文脈によって異なる場合があります。イベント名・スキル名は翻訳表示が異なることがあります。</footer><script>
const DATA=[{"en":"Alliance / Guild","ja":"同盟／ギルド","note":"プレイヤーが協力するグループ"},{"en":"Alliance Defense","ja":"ギルド守衛戦","note":"ギルド守衛戦のイベント名"},{"en":"Alliance Duel","ja":"ギルド対決","note":"英語表記が似ているため要確認。ギルド対決の確認済み表記はAlliance Showdown"},{"en":"Alliance Fort","ja":"ギルド要塞","note":"ギルドの防衛・援軍に関係する施設"},{"en":"Alliance Guard","ja":"ギルド守衛","note":"ギルド守衛戦で防衛に参加する役職・守衛"},{"en":"Alliance Hall","ja":"大使館","note":"増援を受ける施設"},{"en":"Alliance Showdown","ja":"ギルド対決","note":"ギルド全員でクエストを達成しポイントを競うイベント。Showdownとも呼ばれる"},{"en":"ATK (Attack)","ja":"攻撃力","note":"部隊・英雄などの攻撃ステータス"},{"en":"Battle Frenzy","ja":"戦闘狂","note":"攻撃行動などで発生する状態。シールド使用制限に注意"},{"en":"Buff / Debuff","ja":"バフ／デバフ","note":"強化効果／弱体化効果"},{"en":"CC (Control Center)","ja":"コントロールセンター","note":"HQ・避難所レベルに関連"},{"en":"Combat Manuals","ja":"戦闘マニュアル","note":"英雄育成関連"},{"en":"Cooldown / CD","ja":"クールダウン／再使用待ち時間","note":"スキルなどを再び使えるまでの時間"},{"en":"Dead Rising","ja":"デッドライジング","note":"避難所防衛イベント"},{"en":"DEF (Defense)","ja":"防御力","note":"部隊・英雄などの防御ステータス"},{"en":"diamonds","ja":"ダイヤ","note":"ゲーム内通貨"},{"en":"Empire War","ja":"エンパイアウォー","note":"国家間の対戦イベント"},{"en":"Favorite / Favourite","ja":"お気に入り登録","note":"タスクにハート印を付けること。Favoriteは米式、Favouriteは英式"},{"en":"Fighters","ja":"ファイター","note":"兵種"},{"en":"frag / frags","ja":"欠片","note":"英雄の欠片など"},{"en":"gather","ja":"採集する","note":"文脈によっては集まるという意味"},{"en":"Gathering","ja":"採集","note":"資源地で資源を集めること"},{"en":"Gear Enchanting Materials","ja":"装備エンチャント素材","note":"装備育成"},{"en":"Hall of War / War Hall","ja":"戦争ホール","note":"ギャザーの参加規模を増やす施設"},{"en":"Heal / Healing","ja":"治療／回復","note":"負傷兵の治療など"},{"en":"Hive","ja":"ハイブ／集落","note":"同盟メンバーの避難所が集まる場所"},{"en":"HQ (Headquarters)","ja":"CC／避難所レベル","note":"関連：Control Center"},{"en":"Hunt Mastery","ja":"狩猟集中","note":"指揮官スキル。スタミナ消費を軽減する"},{"en":"Infirmary / Hospital","ja":"病院","note":"負傷兵の治療に関係する施設"},{"en":"lair","ja":"ゾンビの巣窟","note":"関連：rally、lair rally"},{"en":"Lair Rally","ja":"巣窟ギャザー","note":"ゾンビの巣窟に対する集結攻撃"},{"en":"League","ja":"リーグ／階級","note":"ギルド対決ではビギナー・ルーキー・アマチュア・プロフェッショナル"},{"en":"March","ja":"行軍／出撃部隊","note":"派遣する部隊、またはその移動"},{"en":"March Slot","ja":"行軍枠","note":"同時に派遣できる部隊の枠"},{"en":"Merge / Merged","ja":"合併する／合併した","note":"CMDとFREが力を合わせる話でも使われた言葉"},{"en":"Might","ja":"戦力","note":"プレイヤーや部隊の強さを示す数値"},{"en":"NAP (Non-Aggression Pact)","ja":"不可侵協定","note":"同盟間で攻撃し合わない取り決め"},{"en":"NAP Rules","ja":"NAPルール","note":"不可侵協定に基づく国家内の取り決め"},{"en":"Personal Quest","ja":"専用クエスト","note":"星印付きの任務。1日最大5回で、通常任務と合わせて全体の受注回数を消費"},{"en":"Promotion / Promote","ja":"昇格する／昇格","note":"ギルド対決で上位リーグへ進むこと"},{"en":"Quest","ja":"クエスト／任務","note":"ギルド対決などで受注し、条件を満たして達成する課題"},{"en":"rally","ja":"ギャザー／集結攻撃","note":"関連：lair、stam rally"},{"en":"Rally Leader","ja":"ギャザー主催者","note":"集結を開始したプレイヤー"},{"en":"Recycle Task","ja":"タスクの更新・入れ替え","note":"不要なタスクを削除して別のタスクが出るのを待つこと。Nauzyさんのメールで使用"},{"en":"Refresh","ja":"更新／再表示","note":"タスクや一覧などを新しくすること"},{"en":"Reinforce / reinforcements","ja":"増援する／増援部隊","note":"関連：Dead Rising"},{"en":"Relegation / Demotion","ja":"降格","note":"ギルド対決で下位リーグへ移ること"},{"en":"Research","ja":"研究","note":"研究所などで進める強化"},{"en":"Reserved Task","ja":"予約済みタスク","note":"ほかの人が予約している任務。CMDでは予約した人のために残す"},{"en":"Riders","ja":"ライダー","note":"兵種"},{"en":"RSS (Resources) / rrs","ja":"資源","note":"食料・木材・鋼材・ガスなど"},{"en":"Sanctuary","ja":"避難所","note":"自分の拠点"},{"en":"Scout","ja":"偵察する","note":"戦闘前の偵察"},{"en":"Seeds","ja":"種","note":"交換の会話など"},{"en":"Shield / Bubble","ja":"シールド／バリア","note":"避難所への攻撃を防ぐ保護効果。採集中の部隊は別"},{"en":"Shooters","ja":"シューター","note":"兵種"},{"en":"Showdown","ja":"ギルド対決","note":"今回CMDが案内したタスク達成型イベントの呼び方。Alliance Showdown等の正式名称とは文脈で区別"},{"en":"Sonic Decoy / Sonic / Trap","ja":"スピーカートラップ","note":"Sonic・Trapとも呼ばれる"},{"en":"stam (stamina)","ja":"スタミナ","note":"関連：stam rally"},{"en":"stam rally","ja":"スタミナ消費目的のギャザー","note":"文脈で意味を確認・暫定"},{"en":"Stamina","ja":"スタミナ","note":"ゾンビ・巣窟の討伐などに使う行動資源"},{"en":"SVS (State vs State)","ja":"州間戦争","note":"サーバー対抗イベント"},{"en":"T1 / T7 (Tier 1 / Tier 7)","ja":"ティア1／ティア7兵士","note":"兵士ランク"},{"en":"Task","ja":"タスク／任務","note":"ギルド対決などで選んで達成する課題。Questとも呼ばれる"},{"en":"Task Limit","ja":"任務の受注回数上限","note":"アマチュアは合計10回。専用クエストもこの回数に含まれる"},{"en":"Teleport / TP","ja":"テレポート／移転","note":"避難所の位置を移動すること"},{"en":"Tile","ja":"資源タイル／採集地","note":"マップ上の資源採集ポイント"},{"en":"Tile Hit / Tile Kill","ja":"タイキル","note":"資源地で採集している部隊への攻撃"},{"en":"troop boost","ja":"部隊強化効果","note":"強化関連"},{"en":"Troops","ja":"兵士／部隊","note":"ファイター・ライダー・シューターなど"},{"en":"UTC (Coordinated Universal Time)","ja":"協定世界時","note":"日本時間は＋9時間"},{"en":"Wave","ja":"ウェーブ／攻撃の波","note":"防衛イベントで繰り返される敵の攻撃"},{"en":"WK (Wasteland King / WLK)","ja":"荒野の王","note":"荒野の王イベント"},{"en":"Wounded","ja":"負傷兵","note":"戦闘で負傷した兵士"}];const EVENTS=new Set(["Alliance Defense", "Dead Rising", "Empire War", "Sonic Decoy / Sonic / Trap", "SVS (State vs State)", "WK (Wasteland King / WLK)"]);let tableView=false;const $=id=>document.getElementById(id);function norm(s){return String(s||'').normalize('NFKC').toLocaleLowerCase()}function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}function render(){const q=norm($('search').value.trim());const subset=DATA.filter(v=>norm([v.en,v.ja,v.note].join(' ')).includes(q));$('count').textContent=subset.length+' / '+DATA.length+' 件';$('toggle').textContent=tableView?'カード表示に切替':'表形式に切替';const host=$('results');host.replaceChildren();if(!subset.length){host.append(el('div','empty','見つかりませんでした。別の言葉で検索してね。'));return}if(tableView){const wrap=el('div','tablewrap'),table=el('table'),head=el('tr');['英語・略語','日本語','補足'].forEach(x=>head.append(el('th','',x)));const thead=el('thead');thead.append(head);table.append(thead);const tbody=el('tbody');subset.forEach(v=>{const tr=el('tr');const nameCell=el('td','',v.en);if(EVENTS.has(v.en))nameCell.append(el('span','event-tag','🎮 イベント'));tr.append(nameCell);[v.ja,v.note].forEach(x=>tr.append(el('td','',x)));tbody.append(tr)});table.append(tbody);wrap.append(table);host.append(wrap)}else{const list=el('div','list');subset.forEach(v=>{const card=el('article','item');const nameRow=el('div','enrow');nameRow.append(el('div','en',v.en));if(EVENTS.has(v.en))nameRow.append(el('span','event-tag','🎮 イベント'));card.append(nameRow,el('div','ja',v.ja),el('div','note',v.note));list.append(card)});host.append(list)}}$('search').addEventListener('input',render);$('clear').addEventListener('click',()=>{$('search').value='';render()});$('toggle').addEventListener('click',()=>{tableView=!tableView;render()});render();
</script></body></html>
